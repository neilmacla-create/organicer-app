<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organicer</title>
  <style>
    :root {
      --bg-dark: #121316;
      --card-bg: #1c1e24;
      --accent-purple: #635bff;
      --accent-purple-hover: #7a73ff;
      --accent-green: #00d26a;
      --accent-green-hover: #26e07f;
      --text-main: #f3f4f6;
      --text-muted: #8c919d;
      --border-color: #2e323e;
      --input-bg: #14161b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 30px 25px;
      user-select: none;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .app-title { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
    .app-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .tabs { display: flex; gap: 10px; }
    .tab-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--card-bg); color: #fff; border-color: var(--accent-purple); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .icon-frame { background: rgba(99, 91, 255, 0.15); color: var(--accent-purple); }
    .icon-drive { background: rgba(0, 210, 106, 0.15); color: var(--accent-green); }

    .card-title { font-size: 15px; font-weight: 600; }
    
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }

    .file-input-group { display: flex; gap: 8px; }
    
    input[type="text"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus { border-color: var(--accent-purple); }

    .btn-browse {
      background: var(--border-color);
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-browse:hover { background: #3d4251; }

    .btn-action {
      margin-top: auto;
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-frame { background: var(--accent-purple); color: white; }
    .btn-frame:hover { background: var(--accent-purple-hover); }

    .btn-drive { background: var(--accent-green); color: #000; font-weight: 700; }
    .btn-drive:hover { background: var(--accent-green-hover); }

    .settings-panel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .log-card {
      background: #0d0e11;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
    }

    .log-header { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    
    #consoleLog {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      color: #00e676;
      height: 110px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div>
      <div class="app-title">Organicer</div>
      <div class="app-subtitle">After Effects Direct Delivery & Backup Console</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabMain" onclick="switchTab('main')">Dashboard</button>
      <button class="tab-btn" id="tabSettings" onclick="switchTab('settings')">API Keys</button>
    </div>
  </div>

  <div id="mainView">
    <div class="grid">
      <!-- Frame.io Panel -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon icon-frame">F</div>
          <div>
            <div class="card-title">Send Draft to Frame.io</div>
          </div>
        </div>

        <div class="form-group">
          <label>1. Select Draft Render (.MP4 / .MOV)</label>
          <div class="file-input-group">
            <input type="text" id="frameFilePath" placeholder="No file selected...">
            <button class="btn-browse" onclick="pickDraftFile()">Browse</button>
          </div>
        </div>

        <div class="form-group">
          <label>2. Frame.io Folder Share Link</label>
          <input type="text" id="frameUrl" placeholder="https://app.frame.io/projects/.../assets/...">
        </div>

        <button class="btn-action btn-frame" onclick="triggerFrameUpload()">Upload First Draft</button>
      </div>

      <!-- Google Drive Panel -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon icon-drive">G</div>
          <div>
            <div class="card-title">Backup AE Project</div>
          </div>
        </div>

        <div class="form-group">
          <label>1. Select AE Project Folder</label>
          <div class="file-input-group">
            <input type="text" id="driveFolderPath" placeholder="No project directory selected...">
            <button class="btn-browse" onclick="pickProjectFolder()">Browse</button>
          </div>
        </div>

        <div class="form-group">
          <label>2. Google Drive Destination Link</label>
          <input type="text" id="driveUrl" placeholder="https://drive.google.com/drive/folders/...">
        </div>

        <button class="btn-action btn-drive" onclick="triggerDriveBackup()">Zip & Backup to Drive</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS PANEL -->
  <div id="settingsView" class="settings-panel">
    <h3 style="margin-bottom: 15px; font-size: 15px;">API Key Configuration</h3>
    
    <div class="form-group">
      <label>Frame.io Developer Token</label>
      <input type="text" id="frameToken" placeholder="fio-u-xxxxxxxx...">
    </div>

    <div class="form-group">
      <label>Google Drive Service Account JSON Credentials</label>
      <textarea id="driveJson" style="width:100%; height:80px; background:var(--input-bg); border:1px solid var(--border-color); color:#fff; border-radius:6px; padding:8px; font-family:monospace; font-size:11px;" placeholder='{"type": "service_account", "project_id": "..."}'></textarea>
    </div>

    <button class="btn-browse" onclick="saveSettings()" style="padding: 8px 16px;">Save Keys</button>
  </div>

  <!-- LIVE SYSTEM LOG -->
  <div class="log-card">
    <div class="log-header">System Output & Activity Log</div>
    <div id="consoleLog">Organicer initialized and ready.</div>
  </div>

  <script>
    function log(msg) {
      const consoleEl = document.getElementById('consoleLog');
      const time = new Date().toLocaleTimeString();
      consoleEl.innerText = `[${time}] ${msg}
` + consoleEl.innerText;
    }

    function switchTab(tab) {
      if (tab === 'main') {
        document.getElementById('mainView').style.display = 'block';
        document.getElementById('settingsView').style.display = 'none';
        document.getElementById('tabMain').classList.add('active');
        document.getElementById('tabSettings').classList.remove('active');
      } else {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('settingsView').style.display = 'block';
        document.getElementById('tabSettings').classList.add('active');
        document.getElementById('tabMain').classList.remove('active');
      }
    }

    async function pickDraftFile() {
      const filePath = await window.api.selectFile([{ name: 'Videos', extensions: ['mp4', 'mov', 'avi'] }]);
      if (filePath) document.getElementById('frameFilePath').value = filePath;
    }

    async function pickProjectFolder() {
      const folderPath = await window.api.selectFolder();
      if (folderPath) document.getElementById('driveFolderPath').value = folderPath;
    }

    function saveSettings() {
      localStorage.setItem('frameToken', document.getElementById('frameToken').value);
      localStorage.setItem('driveJson', document.getElementById('driveJson').value);
      log('API settings saved locally.');
      switchTab('main');
    }

    document.getElementById('frameToken').value = localStorage.getItem('frameToken') || '';
    document.getElementById('driveJson').value = localStorage.getItem('driveJson') || '';

    async function triggerFrameUpload() {
      const filePath = document.getElementById('frameFilePath').value;
      const frameUrl = document.getElementById('frameUrl').value;
      const apiToken = localStorage.getItem('frameToken');

      log('Starting Frame.io draft upload process...');
      const res = await window.api.uploadFrameIo({ filePath, frameUrl, apiToken });
      
      if (res.success) {
        log(`SUCCESS: ${res.message}`);
      } else {
        log(`ERROR: ${res.error}`);
      }
    }

    async function triggerDriveBackup() {
      const projectPath = document.getElementById('driveFolderPath').value;
      const driveUrl = document.getElementById('driveUrl').value;
      const serviceAccountJson = localStorage.getItem('driveJson');

      log('Compressing project folder into ZIP & initiating Google Drive backup...');
      const res = await window.api.backupDrive({ projectPath, driveUrl, serviceAccountJson });

      if (res.success) {
        log(`SUCCESS: ${res.message}`);
      } else {
        log(`ERROR: ${res.error}`);
      }
    }
  </script>
</body>
</html>

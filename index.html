<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organicer Web</title>
  <style>
    :root {
      --bg-dark: #121316;
      --card-bg: #1c1e24;
      --accent-purple: #635bff;
      --accent-green: #00d26a;
      --accent-blue: #0084ff;
      --text-main: #f3f4f6;
      --text-muted: #8c919d;
      --border-color: #2e323e;
      --input-bg: #14161b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 30px 25px; }
    .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    .app-title { font-size: 22px; font-weight: 800; }
    .btn-project { background: #252830; border: 1px solid var(--border-color); color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .btn-project:hover { background: #323642; }
    .active-project-bar { background: rgba(0, 132, 255, 0.1); border: 1px dashed var(--accent-blue); border-radius: 6px; padding: 10px 14px; font-size: 13px; color: #80c2ff; margin-bottom: 20px; display: flex; justify-content: space-between; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; }
    .card h3 { margin-bottom: 15px; font-size: 16px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
    input[type="text"], input[type="file"] { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; outline: none; }
    .btn-action { width: 100%; padding: 11px; border-radius: 6px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 10px; }
    .btn-frame { background: var(--accent-purple); color: white; }
    .btn-drive { background: var(--accent-green); color: #000; font-weight: 700; }
    .log-card { background: #0d0e11; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
    #consoleLog { font-family: monospace; font-size: 12px; color: #00e676; height: 120px; overflow-y: auto; white-space: pre-wrap; }
    #fileInput { display: none; }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="app-title">Organicer <span style="font-size: 12px; color: var(--text-muted); font-weight: normal;">Web Edition</span></div>
    <div style="display:flex; gap:10px;">
      <button class="btn-project" onclick="saveOrganicerFile()">💾 Save .organicer File</button>
      <button class="btn-project" onclick="document.getElementById('fileInput').click()">📂 Open .organicer File</button>
      <input type="file" id="fileInput" accept=".organicer,.json" onchange="loadOrganicerFile(event)">
    </div>
  </div>

  <div class="active-project-bar" id="projectStatus">Active Project: <strong>Unsaved Config</strong></div>

  <div class="grid">
    <!-- Frame.io Card -->
    <div class="card">
      <h3>1. Frame.io Automation</h3>
      <div class="form-group">
        <label>Select Draft Video File</label>
        <input type="file" id="frameFile">
      </div>
      <div class="form-group">
        <label>Frame.io Asset or Share Link</label>
        <input type="text" id="frameUrl" placeholder="https://app.frame.io/projects/...">
      </div>
      <button class="btn-action btn-frame" onclick="triggerFrameUpload()">Upload Draft to Frame.io</button>
    </div>

    <!-- Google Drive Card -->
    <div class="card">
      <h3>2. Google Drive Backup</h3>
      <div class="form-group">
        <label>Project Name / ID</label>
        <input type="text" id="projectName" placeholder="e.g. Commercial_v01">
      </div>
      <div class="form-group">
        <label>Google Drive Folder Link</label>
        <input type="text" id="driveUrl" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <button class="btn-action btn-drive" onclick="triggerDriveBackup()">Backup Project to Drive</button>
    </div>
  </div>

  <!-- Log Console -->
  <div class="log-card">
    <div id="consoleLog">Organicer Web App ready.</div>
  </div>

  <script>
    function log(msg) {
      const consoleElem = document.getElementById('consoleLog');
      consoleElem.innerText = `[${new Date().toLocaleTimeString()}] ${msg}\n` + consoleElem.innerText;
    }

    // 1. SAVE .organicer PROJECT FILE IN BROWSER
    function saveOrganicerFile() {
      const projectData = {
        version: "1.1.0",
        timestamp: new Date().toISOString(),
        projectName: document.getElementById('projectName').value,
        frameUrl: document.getElementById('frameUrl').value,
        driveUrl: document.getElementById('driveUrl').value
      };

      const jsonString = JSON.stringify(projectData, null, 2);
      const blob = new Blob([jsonString], { type: "application/json" });
      const link = document.createElement("a");

      const defaultFilename = (projectData.projectName || "ProjectConfig") + ".organicer";
      link.href = URL.createObjectURL(blob);
      link.download = defaultFilename;
      link.click();
      URL.revokeObjectURL(link.href);

      log(`Saved project file: ${defaultFilename}`);
    }

    // 2. LOAD .organicer PROJECT FILE IN BROWSER
    function loadOrganicerFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          document.getElementById('projectName').value = data.projectName || '';
          document.getElementById('frameUrl').value = data.frameUrl || '';
          document.getElementById('driveUrl').value = data.driveUrl || '';

          document.getElementById('projectStatus').innerHTML = `Active Project: <strong>${file.name}</strong>`;
          log(`Loaded project file: ${file.name}`);
        } catch (err) {
          log(`Error parsing file: ${err.message}`);
        }
      };
      reader.readAsText(file);
    }

    // ACTION HANDLERS
    function triggerFrameUpload() {
      const url = document.getElementById('frameUrl').value;
      const fileInput = document.getElementById('frameFile');
      if (!fileInput.files[0]) {
        log("Error: Please select a video file first.");
        return;
      }
      log(`[Frame.io] Initiating upload for "${fileInput.files[0].name}" to destination: ${url || 'Default Folder'}`);
    }

    function triggerDriveBackup() {
      const name = document.getElementById('projectName').value;
      const url = document.getElementById('driveUrl').value;
      if (!name) {
        log("Error: Please enter a Project Name.");
        return;
      }
      log(`[Google Drive] Preparing backup for "${name}" to Drive folder: ${url || 'Default Folder'}`);
    }
  </script>
</body>
</html>
